<body><main class="shell"><header class="top"><button id="back" class="icon back" aria-label="ゲーム一覧へ戻る">← <span>戻る</span></button><div class="brand">ネオンテトリス‐ドーパミンの補充に<small>FAST FALLING PUZZLE</small></div><div class="top-actions"><button id="mute" class="icon" aria-label="ミュート">♫</button><button id="pause" class="icon" aria-label="一時停止">Ⅱ</button></div></header>

<script>
(()=>{'use strict';
const W=10,H=20, TYPES=['I','O','T','S','Z','J','L'];
const SH={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const JLSTZ={"0>1":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"1>0":[[0,0],[1,0],[1,-1],[0,2],[1,2]],"1>2":[[0,0],[1,0],[1,-1],[0,2],[1,2]],"2>1":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"2>3":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"3>2":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"3>0":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"0>3":[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
const IK={"0>1":[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],"1>0":[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],"1>2":[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],"2>1":[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],"2>3":[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],"3>2":[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],"3>0":[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],"0>3":[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};
const el=id=>document.getElementById(id), boardEl=el('board'), cells=[], state={board:[],bag:[],queue:[],piece:null,hold:null,canHold:true,score:0,lines:0,level:1,combo:-1,b2b:false,lastAction:'',lastKick:0,started:false,paused:false,over:false,dropAt:0,groundAt:null,resets:0,keys:{},repeat:{},muted:false};
const cfg={das:130,arr:35,lock:500,resets:15,volume:.45}; for(let y=0;y<H;y++){state.board[y]=Array(W).fill('');for(let x=0;x<W;x++){let d=document.createElement('div');d.className='cell';boardEl.append(d);cells.push(d)}}
function rot(shape,n,size){let a=shape;for(let i=0;i<n;i++)a=a.map(([x,y])=>[size-1-y,x]);return a} function blocks(p=state.piece){return (p.t==='O'?SH.O:rot(SH[p.t],p.r,p.t==='I'?4:3)).map(([x,y])=>[p.x+x,p.y+y])} function valid(p){return blocks(p).every(([x,y])=>x>=0&&x<W&&y<H&&(y<0||!state.board[y][x]))} function gravity(){let l=state.level-1;return Math.max(35,1000*Math.pow(.8-.007*l,l))} function grounded(){return !valid({...state.piece,y:state.piece.y+1})}

function move(dx,dy,soft=false){if(!playing())return false;let p={...state.piece,x:state.piece.x+dx,y:state.piece.y+dy};if(valid(p)){state.piece=p;state.lastAction=dy?'drop':'move';if(soft&&dy)state.score++;onManip();return true}if(dy){if(state.groundAt===null)state.groundAt=performance.now()}return false}
function onManip(){if(!grounded()){state.groundAt=null;state.resets=0}else if(state.groundAt!==null&&state.resets<cfg.resets){state.groundAt=performance.now();state.resets++}render()}
function rotate(dir){if(!playing())return;let from=state.piece.r,to=(from+dir+4)%4,p={...state.piece,r:to}, kicks=state.piece.t==='O'?[[0,0]]:(state.piece.t==='I'?IK:JLSTZ)[`${from}>${to}`]||[[0,0]];for(let i=0;i<kicks.length;i++){let [x,y]=kicks[i],q={...p,x:p.x+x,y:p.y-y};if(valid(q)){state.piece=q;state.lastAction='rotate';state.lastKick=i;onManip();sfx('rotate');return}}sfx('fail')}
function hard(){if(!playing())return;let d=0;while(valid({...state.piece,y:state.piece.y+1})){state.piece.y++;d++}state.score+=d*2;trail();sfx('hard');lock()}
function hold(){if(!playing()||!state.canHold)return;sfx('hold');let old=state.piece.t;if(state.hold){let h=state.hold;state.hold=old;spawn(h);state.canHold=false}else{state.hold=old;spawn();state.canHold=false}render()}
function lock(){if(!state.piece)return;let spin=detectSpin();for(let [x,y] of blocks())if(y>=0&&y<H)state.board[y][x]=state.piece.t;burst(blocks());sfx('lock');let full=[];for(let y=0;y<H;y++)if(state.board[y].every(Boolean))full.push(y);if(full.length){for(let i=full.length-1;i>=0;i--)state.board.splice(full[i],1);while(state.board.length<H)state.board.unshift(Array(W).fill(''));clearScore(full.length,spin);burst(full.flatMap(y=>Array.from({length:W},(_,x)=>[x,y])))}else{state.combo=-1;if(spin)announce(spin)}spawn()}
function detectSpin(){if(state.piece.t!=='T'||state.lastAction!=='rotate')return '';let p=state.piece,corners=[[p.x,p.y],[p.x+2,p.y],[p.x,p.y+2],[p.x+2,p.y+2]],count=corners.filter(([x,y])=>x<0||x>=W||y>=H||(y>=0&&state.board[y][x])).length;if(count<3)return '';let front={0:[0,1],1:[1,3],2:[2,3],3:[0,2]}[p.r],filled=i=>{let [x,y]=corners[i];return x<0||x>=W||y>=H||(y>=0&&state.board[y][x])};return filled(front[0])&&filled(front[1])?'T-SPIN':'T-SPIN MINI'}
function clearScore(n,spin){state.combo++;let name='',base=0,difficult=false;if(spin){name=spin+(n?` ${['','SINGLE','DOUBLE','TRIPLE'][n]}`:'');base=spin==='T-SPIN MINI'?(n?200:100):[400,800,1200,1600][n];difficult=true}else{name=['','SINGLE','DOUBLE','TRIPLE','NEON CLEAR'][n];base=[0,100,300,500,800][n];difficult=n===4}let pc=state.board.every(r=>r.every(v=>!v)),wasB2B=difficult&&state.b2b;if(wasB2B){base=Math.floor(base*1.5);name='B2B '+name}state.b2b=difficult;let bonus=state.combo>0?50*state.combo*state.level:0;if(pc){bonus+=2000*state.level;name='PERFECT CLEAR!'}state.score+=(base*state.level)+bonus;state.lines+=n;let old=state.level;state.level=Math.floor(state.lines/10)+1;let clearSound=pc?'pc':spin||n===4||wasB2B?'spin':n>=5?'mega':'clear';sfx(clearSound);if(state.level>old){announce(`LEVEL ${state.level}`);sfx('level')}else announce(name+(state.combo>0?` ×${state.combo+1}`:''));render()}
function announce(t){let f=el('feed');f.textContent=t;f.classList.remove('flash');requestAnimationFrame(()=>f.classList.add('flash'))} function playing(){return state.started&&!state.paused&&!state.over}
function renderMini(node,t){node.innerHTML='';if(!t)return;let p={t,x:0,y:0,r:0}, bs=blocks(p),minX=Math.min(...bs.map(v=>v[0])),minY=Math.min(...bs.map(v=>v[1]));node.style.display='grid';node.style.gridTemplateColumns='repeat(4,18px)';node.style.gridTemplateRows='repeat(2,18px)';bs.forEach(([x,y])=>{let d=document.createElement('i');d.className='block c-'+t;d.style.gridColumn=x-minX+1;d.style.gridRow=y-minY+1;node.append(d)})}
function render(){let ghost=[];if(state.piece){let g={...state.piece};while(valid({...g,y:g.y+1}))g.y++;ghost=blocks(g)}cells.forEach((d,i)=>{let x=i%W,y=Math.floor(i/W),v=state.board[y][x],isG=ghost.some(b=>b[0]===x&&b[1]===y),active=state.piece&&blocks().find(b=>b[0]===x&&b[1]===y);d.className='cell'+(v?' block c-'+v:'')+(isG&&!active?' ghost c-'+state.piece.t:'')+(active?' block c-'+state.piece.t:'')});renderMini(el('hold'),state.hold);let ne=el('next');ne.innerHTML='';state.queue.slice(0,5).forEach(t=>{let d=document.createElement('div');d.className='next';renderMini(d,t);ne.append(d)});el('score').textContent=state.score.toLocaleString();el('lines').textContent=state.lines;el('level').textContent=state.level;let best=+localStorage.neonStackBest||0;el('best').textContent=Math.max(best,state.score).toLocaleString()}
function burst(points){let box=boardEl.getBoundingClientRect();points.forEach(([x,y])=>{if(y<0)return;for(let i=0;i<2;i++){let p=document.createElement('i');p.className='particle';p.style.left=(x+.5)*box.width/W+'px';p.style.top=(y+.5)*box.height/H+'px';p.style.setProperty('--x',(Math.random()-.5)*55+'px');p.style.setProperty('--y',(Math.random()-.5)*55+'px');el('particles').append(p);setTimeout(()=>p.remove(),500)}})} function trail(){burst(blocks())}
function gameOver(){state.over=true;state.started=false;syncBgm();let b=+localStorage.neonStackBest||0;if(state.score>b)localStorage.neonStackBest=state.score;el('overlay').classList.remove('hidden');el('overlay').innerHTML=`<div><h1>STACK OVER</h1><p>SCORE ${state.score.toLocaleString()}　LINES ${state.lines}</p><button id="start" class="start">RETRY <small>(SPACE KEY)</small></button></div>`;el('start').onclick=start;sfx('fail');render()}
function start(){state.board=Array.from({length:H},()=>Array(W).fill(''));Object.assign(state,{bag:[],queue:[],piece:null,hold:null,canHold:true,score:0,lines:0,level:1,combo:-1,b2b:false,lastAction:'',started:true,paused:false,over:false,dropAt:performance.now(),groundAt:null,resets:0});ensure();spawn();el('overlay').classList.add('hidden');try{bgm.currentTime=0}catch(_){}audioOn();announce('GO!');render()}
function togglePause(){if(!state.started||state.over)return;state.paused=!state.paused;syncBgm();el('overlay').classList.toggle('hidden',!state.paused);if(state.paused)el('overlay').innerHTML='<div><h1>PAUSED</h1><p>P またはボタンで再開</p><button id="resume" class="start">RESUME</button></div>';if(state.paused)el('resume').onclick=togglePause;else state.dropAt=performance.now();sfx('hold')}
function loop(now){if(playing()){let interval=state.keys.down?gravity()*.05:gravity();if(now-state.dropAt>=interval){move(0,1,state.keys.down);state.dropAt=now}if(grounded()){if(state.groundAt===null)state.groundAt=now;if(now-state.groundAt>=cfg.lock)lock()}else state.groundAt=null;repeatKeys(now)}requestAnimationFrame(loop)}
function repeatKeys(now){['left','right'].forEach(k=>{let q=state.repeat[k];if(state.keys[k]&&q&&now>=q.next){move(k==='left'?-1:1,0);q.next+=cfg.arr||1}})}
const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'cw',x:'cw',X:'cw',z:'ccw',Z:'ccw',Control:'ccw',c:'hold',C:'hold',Shift:'hold',' ':'hard',p:'pause',P:'pause'};
function action(a,down=true){if(a==='left'||a==='right'){if(down&&!state.keys[a]){state.keys[a]=true;move(a==='left'?-1:1,0);state.repeat[a]={next:performance.now()+cfg.das}}else if(!down){state.keys[a]=false;delete state.repeat[a]}return}if(a==='down'){state.keys.down=down;return}if(!down)return;if(a==='cw')rotate(1);if(a==='ccw')rotate(-1);if(a==='hard')hard();if(a==='hold')hold();if(a==='pause')togglePause()}
